syntax = "proto3";

package im.v1;

option go_package = "secure-im/backend/internal/proto/impb;impb";

// MessagePayload 是 MESSAGE 帧的业务内容，oneof 保证一帧只包含文本或文件通知中的一种。
message MessagePayload {
  oneof content {
    string text = 1;
    FileNotification file = 2;
  }
}

// FileNotification 引用文件 API 已生成的文件元数据，文件字节仍通过二进制分块接口传输，不经过 WebSocket JSON。
message FileNotification {
  string file_id = 1;
  string filename = 2;
  int64 size = 3;
}

// AckPayload 表示服务端已持久化的确认，cursor 是已确认的服务端同步游标。
message AckPayload {
  uint64 cursor = 1;
}

// ErrorPayload 中 code 是供程序分支处理的稳定错误码，message 是供人阅读的说明，不应作为程序判断依据。
message ErrorPayload {
  string code = 1;
  string message = 2;
}
