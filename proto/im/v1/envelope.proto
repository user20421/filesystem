syntax = "proto3";

package im.v1;

option go_package = "secure-im/backend/internal/proto/impb;impb";

// Envelope 是服务端唯一接受的 WebSocket 二进制外层帧。
// version 标识协议版本；type 决定 payload 的解码方式，MESSAGE/ACK/ERROR 使用对应业务 Payload，PING/PONG/READ 的 payload 为空。
// message_id 用于消息幂等与 ACK 关联，conversation_id 用于会话路由，sender_id/recipient_id 标识方向，device_id 区分多设备。
// timestamp 和 read_at 均为 Unix 毫秒，read_at 为 0 表示未读；cursor 是服务端确认的同步游标。
message Envelope {
  uint32 version = 1;
  Type type = 2;
  string message_id = 3;
  string conversation_id = 4;
  string sender_id = 5;
  string recipient_id = 6;
  string device_id = 7;
  int64 timestamp = 8;
  bytes payload = 9;
  uint64 cursor = 10;
  int64 read_at = 11; // Unix milliseconds; zero means unread.

  enum Type {
    // 未指定类型，不属于合法业务帧。
    TYPE_UNSPECIFIED = 0;
    // 聊天消息，payload 为 MessagePayload。
    MESSAGE = 1;
    // 服务端保存确认，payload 为 AckPayload，不表示对方已读。
    ACK = 2;
    // 错误帧，payload 为 ErrorPayload。
    ERROR = 3;
    // 应用层心跳请求，payload 为空。
    PING = 4;
    // 心跳响应，payload 为空。
    PONG = 5;
    // 已读状态同步，使用 cursor 和 read_at 表示阅读进度。
    READ = 6;
  }
}
